[_HELP_OthersSettings] 
ExcludeSetupFiles=<extension separate by comma to exclude on copy setup files>
TitleFont=<-20 to 20 increase or decrease font size to conversion title>
SubTitleFont=<-20 to 20 increase or decrease font size to conversion title>
CreatorFont=<-20 to 20 increase or decrease font size to creator subtitle>
Facompress=<0/1 add facompress libraries for conversion compression and decompression>
AutoLOG=<0/1/2 generate log or log + summary automatically when advancing compression>
TestDataFiles=<0/1 test compressed files after compression>

[_HELP_CommonSettings]
Conversion=<name to conversion.
Creator=<conversion creator>
OutputPath=<path to destination of compressed files>
SetupFilesPath=<path where is the installer files> 
DSGExec=<0/1 copy DiskSpan GUI executable to first media folder if setup files do not exist>
EGPath=<installation example path to all game if not defined in game E.G path>
Autorun=<executable name to autorun of installer>
Setup=<executable name to setup of installer>
Icon=<icon name or executable name to use in icon to selected media type>
DiskLabel=<label/folder/iso name to selected media type>
DLLPassword=<password optional to compress Setup.dll file or you can also use "<setuphash>" without quotes to use Setup.exe hash as password>
MethodState=<0/1/2 hides the method selection edit for the end user, 0=never hide, 1=hide if not predefined, 2=hide always>
MethodDisable=<0/1/2 disables the method selection for the end user, 0=never disable, 1=disable choose button, 2=hide method selection objects>
MethodLock=<0/1/2 locks all method comboboxes and plays all index when making a switch by holding CTRL key, or always lock the combobox>
Method#=<method commom to compress all data files if game method and data method is empty>
Password=<password commom to use in all data files if game method and data method is empty>
DefaultDisk=<DVD5/DVD9/BD25/BD50/BD100 default tab to activate on selection of disks>
DVD5Size=<first disk size>:<others disk size> can use units like mb, gb, etc. and can also put decimal values using point
DVD9Size=<first disk size>:<others disk size> can use units like mb, gb, etc. and can also put decimal values using point
BD25Size=<first disk size>:<others disk size> can use units like mb, gb, etc. and can also put decimal values using point
BD50Size=<first disk size>:<others disk size> can use units like mb, gb, etc. and can also put decimal values using point
BD100Size=<first disk size>:<others disk size> can use units like mb, gb, etc. and can also put decimal values using point
InstallerType=<STEAM/GOG/UWP separate by comma, the first item is set as the default item>
DefaultType=<index of combobox selection to installer type>

[_HELP_Game#Settings]
Name=<game name>
Exec=<exec to search in selected installation path>
MethodState=<0/1/2 hides the method selection edit for the end user, 0=never hide, 1=hide if not predefined, 2=hide always>
MethodDisable=<0/1/2 disables the method selection for the end user, 0=never disable, 1=disable choose button, 2=hide method selection objects>
MethodLock=<0/1/2 locks all method comboboxes and plays all index when making a switch by holding CTRL key, or always lock the combobox>
Method#=<method to compress all data files from this game if data method is empty>
Password=<password to use in all data files from this game if data method is empty>
EGPath=<installation example path to this game>
GameDir=<predefined game installation path>
Groups=<optional Arc.groups file to use with current game>

XDelta3.Threshold=<0..100 percentage of progress bar reserved for patching against percentage of progress bar occupied by installing the same game>
XDelta3.MaskPatch=<0/1 enables XDelta3 patch mode using masks. Must have "*" in both masks> 
XDelta3.ListPatch=<0/1 enable XDelta3 patch mode using filename list. You can omit the name or use "*" in the destination to represent that the destination name is the same as the source name>
XDelta3.FileMask=<input and output masks consecutively using comma separator>
XDelta3.FileList=<list of patch filenames using comma separator to include destination other than original file name>

Data#.Name=<compressed file name with increment index value "1">
Data#.Destin=<custom destination for extracting the files that will be inserted in the records.ini file>
Data#.Tasks=<installer task ID like "2" or "1,3,8">
Data#.Languages=<installer language like "EN" or "DE,FR,IT">
Data#.MethodState=<0/1/2 hides the method selection edit for the end user, 0=never hide, 1=hide if not predefined, 2=hide always>
Data#.MethodDisable=<0/1/2 disables the method selection for the end user, 0=never disable, 1=disable choose button, 2=hide method selection objects>
Data#.Method#=<method to compress only this data file>
Data#.Password=<password to use in this data file if data method not is empty>
Data#.InclText=<include file list text breaking lines with "|" character>
Data#.ExclText=<exclude file list text breaking lines with "|" character>
Data#.InclList=<include file list to filter compression paths or extensions>
Data#.ExclList=<exclude file list to filter paths or extensions to ignore>
Data#.RunBefore=<file ".bat" or ".exe" to run before compression this data file>
Data#.RunAfter=<file ".bat" or ".exe" to run after compression this data file>
Data#.Source=<custom source path with support for Inno Setup constants containing files to be compressed>
Data#.SkipFile=<skip file compression if custom path does not exist>
Data#.SplitMode=<0/1 mark if not use cls-diskspan.dll to this data file> 

