[mpz_pmt]
Encode = .\..\MPZ\mpzapi.exe c <stdin> <stdout>
Decode = .\..\MPZ\mpzapi.exe d <stdin> <stdout>

[mpzapi_pmt]
Encode = .\..\MPZ\mpzapi.exe c <stdin> <stdout>
Decode = .\..\MPZ\mpzapi.exe d <stdin> <stdout>

[precomp_pmt]
Encode = .\..\Precomp\precomp.exe -cn -intense -opackedfile.pcf datafile 
Decode = .\..\Precomp\precomp.exe -r -odatafile packedfile.pcf
Infile = datafile
Outfile = packedfile.pcf

[razor_pmt]
Encode = .\..\RAZOR\STDIO\RAZOR.exe a -y -d 64m $stdio$ <stdin> <stdout>
Decode = .\..\RAZOR\STDIO\RAZOR.exe e -y $stdio$ <stdin> <stdout>

[rz_pmt]
Encode = .\..\RAZOR\STANDARD\RZ.exe a -d 32m pmtoutfile.tmp pmtinfile.tmp
Decode = .\..\RAZOR\STANDARD\RZ.exe e -y pmtoutfile.tmp pmtinfile.tmp
