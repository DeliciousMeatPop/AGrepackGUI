name: Build & draft release

# Manual release: Actions tab -> "Build & draft release" -> Run workflow ->
# type the version (e.g. 1.0.1). That input is the single source of truth: it
# is written into __version__ in DMPRepackGUI.py, committed back to the branch,
# built into the exe, and used as the vX.Y.Z draft-release tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.1 (sets __version__ everywhere and the vX.Y.Z tag)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set version (source of truth) and commit
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim().TrimStart('v')
          # Require major.minor.patch (2-3 dots). A two-segment version like
          # "1.06" parses to (1, 6), which sorts ABOVE "1.0.7" -> (1, 0, 7) and
          # breaks the in-app update check, so reject it up front.
          if ($ver -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Error "Invalid version '$ver' — use major.minor.patch, e.g. 1.0.7"
            exit 1
          }
          $path = "DMPRepackGUI.py"
          $content = Get-Content $path -Raw
          $content = [regex]::Replace($content, '__version__\s*=\s*"[^"]*"', "__version__ = `"$ver`"")
          Set-Content -Path $path -Value $content -NoNewline
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$ver"    | Out-File -FilePath $env:GITHUB_ENV -Append

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DMPRepackGUI.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release v$ver"
            git push origin "HEAD:${{ github.ref_name }}"
          } else {
            Write-Host "__version__ already $ver — nothing to commit."
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Generate version resource
        run: python make_version_file.py

      - name: Build (onedir)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --console --contents-directory="runtime" `
            --icon="setup.ico" --name="AG Repack GUI" `
            --version-file="version_info.txt" --distpath="dist" DMPRepackGUI.py

      - name: Package (zip exe + runtime)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AG Repack GUI/*" `
            -DestinationPath "dist/AG Repack GUI.zip" -Force

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:TAG"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --target (git rev-parse HEAD) `
              --notes "Automated build of $tag. Review, then publish to roll out the in-app update."
          }
          gh release upload $tag "dist/AG Repack GUI.zip" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Repack-GUI
          path: dist/AG Repack GUI.zip
