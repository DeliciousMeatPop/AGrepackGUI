name: Build & draft release

# Push a tag that matches __version__ (e.g. v1.0.1) to build the Windows exe
# and attach it to a draft release.  Review the draft, then publish it — the
# in-app updater reads releases/latest, so only PUBLISHED releases go out.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Generate version resource
        run: python make_version_file.py

      - name: Verify tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path DMPRepackGUI.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") {
            Write-Error "Tag $tag does not match __version__ (v$v). Bump __version__ or fix the tag."
            exit 1
          }
          Write-Host "Tag $tag matches __version__ v$v"

      - name: Build (onedir)
        shell: pwsh
        run: |
          python -m PyInstaller --onedir --console --contents-directory="runtime" `
            --icon="setup.ico" --name="AG Repack GUI" `
            --version-file="version_info.txt" --distpath="dist" DMPRepackGUI.py

      - name: Package (zip exe + runtime)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AG Repack GUI/*" `
            -DestinationPath "dist/AG Repack GUI.zip" -Force

      - name: Create / update draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Automated build of $tag. Review, then publish to roll out the in-app update."
          }
          gh release upload $tag "dist/AG Repack GUI.zip" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Repack-GUI
          path: dist/AG Repack GUI.zip
